<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICTE Complaint Monitoring Dashboard - SIH 2026</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#0F766E',
                            soft: '#E6F4F2',
                            bg: '#F5F7FA',
                            amber: '#D97706',
                            red: '#DC2626',
                            green: '#16A34A',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F7FA; color: #1F2937; }
    </style>
</head>
<body class="bg-[#F5F7FA] min-h-screen text-gray-800 flex flex-col">

    <!-- AUTH & ROLE SWITCHER BANNER -->
    <div id="auth-banner" class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <span class="bg-[#0F766E] text-xs font-semibold px-2.5 py-1 rounded">SIH 2026 DEMO (SIH26264)</span>
            <span class="text-sm font-medium">AICTE Grievance & Complaints Monitoring System</span>
        </div>
        <div class="flex items-center space-x-3 text-sm">
            <span>Switch Role:</span>
            <button onclick="switchRole('officer')" id="btn-role-officer" class="px-3 py-1 rounded bg-[#0F766E] font-medium transition">Officer (Rajesh Verma)</button>
            <button onclick="switchRole('student')" id="btn-role-student" class="px-3 py-1 rounded bg-slate-700 font-medium transition">Student (Aarav Sharma)</button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- FEEDBACK FLOATING BUTTON -->
    <div class="fixed bottom-6 right-6 z-50">
        <button onclick="toggleFeedback()" class="bg-[#0F766E] text-white p-3.5 rounded-full shadow-lg hover:bg-teal-800 transition flex items-center space-x-2 text-sm font-medium">
            <i data-lucide="message-square" class="w-5 h-5"></i>
            <span>Feedback</span>
        </button>
    </div>

    <!-- FEEDBACK MODAL -->
    <div id="feedback-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900">Send System Feedback</h3>
                <button onclick="toggleFeedback()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-gray-500 mb-4">Help us improve the AICTE grievance handling workflow.</p>
            <textarea id="feedback-text" rows="4" class="w-full border border-gray-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#0F766E]" placeholder="Enter your comments or suggestions here..."></textarea>
            <div class="mt-4 flex justify-end space-x-2">
                <button onclick="toggleFeedback()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
                <button onclick="submitFeedback()" class="px-4 py-2 text-sm bg-[#0F766E] text-white rounded-lg hover:bg-teal-800 font-medium">Submit Feedback</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT APPLICATION LOGIC -->
    <script>
        let currentRole = 'officer';
        let currentTab = 'overview';
        let studentTab = 'my-complaints';
        let selectedCaseId = null;
        let isFeedbackOpen = false;

        // Chart View States for Infographics
        let chartViews = {
            trend: 'bar', // 'bar', 'pie', 'area'
            status: 'pie', // 'pie', 'bar', 'donut'
            category: 'bar' // 'bar', 'pie'
        };

        const stateData = {
            officer: {
                name: "Rajesh Verma",
                bureau: "Regulation Bureau",
                region: "Regional Office Bhopal, Madhya Pradesh",
                stats: { pending: 12, processing: 28, verification: 7, risk: 4 }
            },
            student: {
                name: "Aarav Sharma",
                college: "Malwa Institute of Technology, Indore",
                aicteId: "AICTE-MP-0492"
            },
            cases: [
                { id: "AICTE-2026-000123", college: "Malwa Institute of Technology, Indore", aicteId: "AICTE-MP-0492", category: "Hostel", bureau: "Regulation Bureau", officer: "Rajesh Verma", received: "2026-10-10", sla: "3 days left", status: "Under processing", priority: "High", priorityReason: "Repeat complaint within 7 days", isRepeat: true, isHotspot: true, description: "Unsanitary drinking water coolers and broken door latches in Block C hostel for past two weeks.", complainant: "Aarav Sharma", timeline: [{ actor: "System", action: "Received", note: "Auto-routed to Regulation Bureau", time: "2026-10-10" }, { actor: "Rajesh Verma", action: "Taken", note: "SLA timer initiated (15 days)", time: "2026-10-11" }] },
                { id: "AICTE-2026-000124", college: "Acropolis Institute, Indore", aicteId: "AICTE-MP-0311", category: "Fee fraud", bureau: "Fee Regulation", officer: "S. K. Mehta", received: "2026-10-12", sla: "7 days left", status: "Pending", priority: "Medium", priorityReason: "SLA at risk", isRepeat: false, isHotspot: false, description: "College charging arbitrary development fees outside approved fee structure.", complainant: "Priya Singh", timeline: [{ actor: "System", action: "Received", note: "Auto-routed to Fee Regulation", time: "2026-10-12" }] },
                { id: "AICTE-2026-000125", college: "LNCT University, Bhopal", aicteId: "AICTE-MP-0182", category: "Faculty shortage", bureau: "Regulation Bureau", officer: "Rajesh Verma", received: "2026-10-14", sla: "1 day left (At Risk)", status: "Pending verification", priority: "High", priorityReason: "SLA at risk", isRepeat: false, isHotspot: true, description: "Only 1 professor for 120 students in Advanced Data Structures course.", complainant: "Rohan Patel", proof: "faculty_audit_report.pdf", timeline: [{ actor: "Rajesh Verma", action: "Mark Solved", note: "Uploaded faculty deployment compliance report.", time: "2026-10-25" }] },
                { id: "AICTE-2026-000126", college: "SGSITS, Indore", aicteId: "AICTE-MP-0012", category: "Infrastructure", bureau: "PGRC", officer: "Amit Joshi", received: "2026-10-05", sla: "Breached", status: "Solved", priority: "Low", priorityReason: "Standard queue", isRepeat: false, isHotspot: false, description: "Laboratory oscilloscope calibration expired across ECE department.", complainant: "Neha Gupta", timeline: [{ actor: "Amit Joshi", action: "Solved", note: "Calibration certificates verified.", time: "2026-10-20" }] }
            ],
            districts: [
                { name: "Indore", colleges: 42, open: 14, amber: 5, red: 2 },
                { name: "Bhopal", colleges: 38, open: 12, amber: 3, red: 1 },
                { name: "Gwalior", colleges: 24, open: 8, amber: 2, red: 0 },
                { name: "Jabalpur", colleges: 22, open: 6, amber: 1, red: 0 },
                { name: "Ujjain", colleges: 15, open: 4, amber: 1, red: 0 }
            ],
            overlaps: [
                { id: 1, title: "Same college, same issue, also with PGRC", case1: "AICTE-2026-000123", case2: "AICTE-2026-000199", college: "Malwa Institute of Technology, Indore", category: "Hostel", linked: false }
            ]
        };

        function switchRole(role) {
            currentRole = role;
            if (role === 'officer') {
                document.getElementById('btn-role-officer').className = "px-3 py-1 rounded bg-[#0F766E] font-medium transition shadow";
                document.getElementById('btn-role-student').className = "px-3 py-1 rounded bg-slate-700 font-medium transition opacity-70 hover:opacity-100";
            } else {
                document.getElementById('btn-role-student').className = "px-3 py-1 rounded bg-[#0F766E] font-medium transition shadow";
                document.getElementById('btn-role-officer').className = "px-3 py-1 rounded bg-slate-700 font-medium transition opacity-70 hover:opacity-100";
            }
            render();
        }

        function setOfficerTab(tab) {
            currentTab = tab;
            render();
        }

        function setStudentTab(tab) {
            studentTab = tab;
            render();
        }

        function setChartView(chartKey, type) {
            chartViews[chartKey] = type;
            render();
        }

        function openDrawer(caseId) {
            selectedCaseId = caseId;
            render();
        }

        function closeDrawer() {
            selectedCaseId = null;
            render();
        }

        function toggleFeedback() {
            isFeedbackOpen = !isFeedbackOpen;
            const modal = document.getElementById('feedback-modal');
            if (isFeedbackOpen) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function submitFeedback() {
            const text = document.getElementById('feedback-text').value;
            if (!text) return alert('Please enter some feedback.');
            alert('Thank you! Your feedback has been submitted to the AICTE system.');
            document.getElementById('feedback-text').value = '';
            toggleFeedback();
        }

        function simulatePortalComplaint() {
            const newId = `AICTE-2026-000${Math.floor(100 + Math.random() * 900)}`;
            stateData.cases.unshift({
                id: newId,
                college: "Malwa Institute of Technology, Indore",
                aicteId: "AICTE-MP-0492",
                category: "Hostel",
                bureau: "Regulation Bureau",
                officer: "Unassigned",
                received: new Date().toISOString().split('T')[0],
                sla: "15 days left",
                status: "Pending",
                priority: "High",
                priorityReason: "New portal grievance",
                isRepeat: true,
                isHotspot: true,
                description: "Simulated portal grievance regarding cafeteria sanitation and water supply.",
                complainant: "Aarav Sharma",
                timeline: [{ actor: "System", action: "Received", note: "Auto-routed to Regulation Bureau from Portal", time: new Date().toLocaleString() }]
            });
            alert(`Portal complaint simulated successfully! Created Case ID: ${newId}`);
            render();
        }

        function takeCase(id) {
            const c = stateData.cases.find(x => x.id === id);
            if (c) {
                c.status = "Under processing";
                c.officer = "Rajesh Verma";
                c.timeline.push({ actor: "Rajesh Verma", action: "Taken", note: "SLA timer started.", time: new Date().toLocaleString() });
                render();
            }
        }

        function solveCase(id) {
            const note = prompt("Enter resolution notes and proof details:");
            if (!note) return;
            const c = stateData.cases.find(x => x.id === id);
            if (c) {
                c.status = "Pending verification";
                c.proof = "resolution_proof.pdf";
                c.timeline.push({ actor: "Rajesh Verma", action: "Mark Solved", note: note, time: new Date().toLocaleString() });
                render();
            }
        }

        function studentVerify(id, action) {
            const c = stateData.cases.find(x => x.id === id);
            if (!c) return;
            if (action === 'confirm') {
                c.status = "Solved";
                c.timeline.push({ actor: "Aarav Sharma", action: "Confirmed", note: "Student verified and closed case.", time: new Date().toLocaleString() });
                alert("Case confirmed and closed successfully!");
            } else {
                const reason = prompt("Please provide a reason for rejection:");
                if (!reason) return;
                c.status = "Under processing";
                c.timeline.push({ actor: "Aarav Sharma", action: "Rejected", note: `Reason: ${reason}`, time: new Date().toLocaleString() });
                alert("Case reopened and sent back to officer.");
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (currentRole === 'officer') {
                app.innerHTML = renderOfficerShell();
            } else {
                app.innerHTML = renderStudentShell();
            }
            lucide.createIcons();
        }

        function renderOfficerShell() {
            return `
                <div class="flex flex-1">
                    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-4 shadow-sm">
                        <div>
                            <div class="mb-6 px-2">
                                <h1 class="font-bold text-gray-900 text-base">AICTE Grievance Desk</h1>
                                <p class="text-xs text-gray-500">Officer Portal (SIH 2026)</p>
                            </div>
                            <div class="mb-4">
                                <button onclick="openNextPriority()" class="w-full bg-[#0F766E] text-white py-2.5 px-4 rounded-xl text-sm font-medium hover:bg-teal-800 transition shadow-sm flex items-center justify-center space-x-2">
                                    <i data-lucide="zap" class="w-4 h-4"></i>
                                    <span>Open next priority case</span>
                                </button>
                            </div>
                            <nav class="space-y-1">
                                ${sidebarNavItem('overview', 'Overview', 'layout-dashboard')}
                                ${sidebarNavItem('complaints', 'Complaints', 'file-text')}
                                ${sidebarNavItem('priority', 'Priority list', 'list-ordered')}
                                ${sidebarNavItem('colleges', 'Colleges', 'graduation-cap')}
                                ${sidebarNavItem('overlaps', 'Overlaps', 'git-pull-request')}
                                ${sidebarNavItem('officers', 'Officers (Action history)', 'users')}
                                ${sidebarNavItem('reports', 'Reports', 'bar-chart-3')}
                                ${sidebarNavItem('settings', 'Settings', 'settings')}
                            </nav>
                        </div>
                        <div class="pt-4 border-t border-gray-100 text-xs text-gray-500 px-2">
                            <p class="font-medium text-gray-800">Rajesh Verma</p>
                            <p>Regulation Bureau, Bhopal</p>
                        </div>
                    </aside>

                    <div class="flex-1 flex flex-col min-w-0">
                        <header class="h-16 bg-white border-b border-gray-200 px-8 flex items-center justify-between shadow-sm">
                            <div class="flex items-center space-x-4 w-96">
                                <div class="relative w-full">
                                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                                    <input type="text" placeholder="Search case ID, college or AICTE ID..." class="w-full pl-9 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0F766E]">
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                <button onclick="simulatePortalComplaint()" class="text-xs bg-[#E6F4F2] text-[#0F766E] font-medium px-3 py-1.5 rounded-lg hover:bg-teal-100 transition">
                                    + Simulate Portal Complaint
                                </button>
                                <div class="relative">
                                    <button class="p-2 text-gray-500 hover:text-gray-700 relative">
                                        <i data-lucide="bell" class="w-5 h-5"></i>
                                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-600 rounded-full"></span>
                                    </button>
                                </div>
                            </div>
                        </header>

                        <main class="flex-1 p-8 overflow-y-auto relative">
                            ${renderOfficerCurrentPage()}
                        </main>
                    </div>
                </div>
                ${selectedCaseId ? renderCaseDrawer() : ''}
            `;
        }

        function sidebarNavItem(id, label, icon) {
            const active = currentTab === id;
            return `
                <button onclick="setOfficerTab('${id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${active ? 'bg-[#E6F4F2] text-[#0F766E]' : 'text-gray-600 hover:bg-gray-50' }">
                    <i data-lucide="${icon}" class="w-4 h-4"></i>
                    <span>${label}</span>
                </button>
            `;
        }

        function openNextPriority() {
            const high = stateData.cases.find(c => c.status !== 'Solved');
            if (high) openDrawer(high.id);
            else alert('No pending priority cases found.');
        }

        function renderOfficerCurrentPage() {
            switch(currentTab) {
                case 'overview': return renderOverviewPage();
                case 'complaints': return renderComplaintsPage();
                case 'priority': return renderPriorityPage();
                case 'colleges': return renderCollegesPage();
                case 'overlaps': return renderOverlapsPage();
                case 'officers': return renderOfficersPage();
                case 'reports': return renderReportsPage();
                case 'settings': return renderSettingsPage();
                default: return renderOverviewPage();
            }
        }

        function renderOverviewPage() {
            return `
                <div class="space-y-6">
                    <!-- Global Filter Bar -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap items-center gap-4">
                        <select class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm"><option>All Bureaus</option><option>Regulation Bureau</option></select>
                        <select class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm"><option>All Districts (Madhya Pradesh)</option><option>Indore</option><option>Bhopal</option></select>
                        <select class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm"><option>All Categories</option><option>Hostel</option><option>Fee fraud</option></select>
                        <input type="date" class="bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm" value="2026-10-01">
                    </div>

                    <!-- Row 1: KPI Cards -->
                    <div class="grid grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs text-gray-500 font-medium">Pending (New)</span>
                                <div class="w-8 h-8 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600"><i data-lucide="clock" class="w-4 h-4"></i></div>
                            </div>
                            <div class="text-3xl font-bold text-gray-900">12</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs text-gray-500 font-medium">Under processing</span>
                                <div class="w-8 h-8 rounded-xl bg-[#E6F4F2] flex items-center justify-center text-[#0F766E]"><i data-lucide="loader" class="w-4 h-4"></i></div>
                            </div>
                            <div class="text-3xl font-bold text-gray-900">28</div>
                            <span class="text-xs text-amber-600 mt-1 block">3 close to SLA deadline</span>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs text-gray-500 font-medium">Pending verification</span>
                                <div class="w-8 h-8 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600"><i data-lucide="shield-alert" class="w-4 h-4"></i></div>
                            </div>
                            <div class="text-3xl font-bold text-gray-900">7</div>
                        </div>
                        <div class="bg-[#0F766E] text-white p-6 rounded-2xl shadow-sm">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs text-teal-100 font-medium">SLA at risk / Breached</span>
                                <div class="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center text-white"><i data-lucide="alert-triangle" class="w-4 h-4"></i></div>
                            </div>
                            <div class="text-3xl font-bold">4</div>
                            <span class="text-xs text-teal-100 mt-1 block">Requires immediate officer action</span>
                        </div>
                    </div>

                    <!-- Row 2: Wide interactive chart + Priority Queue -->
                    <div class="grid grid-cols-3 gap-6">
                        <div class="col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-semibold text-gray-900 text-base">Complaints over time (Infographic View)</h3>
                                <div class="flex items-center space-x-2">
                                    <button onclick="setChartView('trend', 'bar')" class="px-2.5 py-1 text-xs rounded-lg font-medium ${chartViews.trend === 'bar' ? 'bg-[#0F766E] text-white' : 'bg-gray-100 text-gray-600'}">Bar</button>
                                    <button onclick="setChartView('trend', 'pie')" class="px-2.5 py-1 text-xs rounded-lg font-medium ${chartViews.trend === 'pie' ? 'bg-[#0F766E] text-white' : 'bg-gray-100 text-gray-600'}">Pie</button>
                                    <button onclick="setChartView('trend', 'area')" class="px-2.5 py-1 text-xs rounded-lg font-medium ${chartViews.trend === 'area' ? 'bg-[#0F766E] text-white' : 'bg-gray-100 text-gray-600'}">Area</button>
                                </div>
                            </div>
                            <div class="h-64 flex items-center justify-center">
                                ${renderTrendChart()}
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-semibold text-gray-900 text-base">Priority list (Top 6)</h3>
                                <button onclick="setOfficerTab('priority')" class="text-xs text-[#0F766E] font-medium hover:underline">View all</button>
                            </div>
                            <div class="space-y-3">
                                ${stateData.cases.slice(0, 3).map(c => `
                                    <div onclick="openDrawer('${c.id}')" class="p-3 bg-gray-50 hover:bg-gray-100 rounded-xl cursor-pointer transition flex items-center justify-between">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-xs font-bold text-red-600 uppercase">${c.priority}</span>
                                                ${c.isRepeat ? '<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded">Repeat</span>' : ''}
                                            </div>
                                            <p class="text-xs font-semibold text-gray-800 mt-0.5 truncate w-48">${c.college}</p>
                                        </div>
                                        <span class="text-xs text-gray-500">${c.sla}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Row 3: Three Colorful Analytics Cards -->
                    <div class="grid grid-cols-3 gap-6">
                        <!-- Card 1: Status Split -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-semibold text-gray-900 text-sm">Status Split (Donut / Pie)</h3>
                                <div class="flex space-x-1">
                                    <button onclick="setChartView('status', 'pie')" class="px-2 py-0.5 text-[10px] rounded ${chartViews.status === 'pie' ? 'bg-[#0F766E] text-white' : 'bg-gray-100 text-gray-600'}">Pie</button>
                                    <button onclick="setChartView('status', 'bar')" class="px-2 py-0.5 text-[10px] rounded ${chartViews.status === 'bar' ? 'bg-[#0F766E] text-white' : 'bg-gray-100 text-gray-600'}">Bar</button>
                                </div>
                            </div>
                            <div class="h-48 flex items-center justify-center">
                                ${renderStatusChart()}
                            </div>
                        </div>

                        <!-- Card 2: Complaints by Category -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-semibold text-gray-900 text-sm">Complaints by Category</h3>
                                <span class="text-[10px] text-gray-400">Horizontal Bars</span>
                            </div>
                            <div class="space-y-2.5">
                                <div>
                                    <div class="flex justify-between text-xs mb-1"><span class="font-medium text-gray-700">Hostel</span><span class="text-gray-500">42 cases</span></div>
                                    <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden"><div class="bg-[#0F766E] h-full rounded-full" style="width: 85%"></div></div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs mb-1"><span class="font-medium text-gray-700">Fee Fraud</span><span class="text-gray-500">28 cases</span></div>
                                    <div class="w-full bg-gray-100 h-2.5 rounded-full overflow-hidden"><div class="bg-[#D97706] h-full rounded-full" style="width: 60%"></div></div>

                            <div class="grid grid-cols-3 gap-6">
                                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                    <span class="text-xs text-gray-500 font-medium">Open Complaints</span>
                                    <div class="text-3xl font-bold text-gray-900 mt-2">2</div>
                                </div>
                                <div class="bg-[#E6F4F2] border border-teal-100 p-6 rounded-2xl shadow-sm">
                                    <span class="text-xs text-[#0F766E] font-medium font-semibold">Waiting for your confirmation</span>
                                    <div class="text-3xl font-bold text-[#0F766E] mt-2">1</div>
                                </div>
                                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                    <span class="text-xs text-gray-500 font-medium">Solved & Closed</span>
                                    <div class="text-3xl font-bold text-gray-900 mt-2">3</div>
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="p-6 border-b border-gray-100 font-bold text-gray-900">Your Filed Complaints</div>
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500">
                                            <th class="p-4">Case ID</th>
                                            <th class="p-4">Category</th>
                                            <th class="p-4">Description</th>
                                            <th class="p-4">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 text-sm">
                                        ${stateData.cases.map(c => `
                                            <tr class="hover:bg-gray-50">
                                                <td class="p-4 font-semibold text-[#0F766E]">${c.id}</td>
                                                <td class="p-4 text-gray-800">${c.category}</td>
                                                <td class="p-4 text-gray-600 truncate max-w-xs">${c.description}</td>
                                                <td class="p-4"><span class="bg-teal-50 text-teal-800 px-2.5 py-1 rounded-full text-xs font-medium">${c.status}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </main>
                    </div>
                </div>
            `;
        }

        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
